name: Deploy to Frankfurt Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and deploy
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.FRANKFURT_SSH_KEY }}" > ~/.ssh/frankfurt_key
          chmod 600 ~/.ssh/frankfurt_key
          ssh -i ~/.ssh/frankfurt_key -o StrictHostKeyChecking=no root@104.248.45.198 << 'EOSSH'
          cd /var/www/aegis_nexus
          git pull origin main
          source venv/bin/activate
          pip install -r requirements.txt
          echo "✅ Deployment complete!"
          EOSSH
