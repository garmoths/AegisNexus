name: Deploy to Frankfurt Server

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H $SERVER_IP >> ~/.ssh/known_hosts
          
          ssh -i ~/.ssh/deploy_key $SERVER_USER@$SERVER_IP << 'EOF'
          cd /var/www/aegis_nexus
          git pull origin main
          source venv/bin/activate
          
          # Kill old processes
          pkill -f uvicorn || true
          pkill -f "app/api_server.py" || true
          sleep 1
          
          # Start uvicorn
          nohup uvicorn app.api_server:app --host 0.0.0.0 --port 8000 > logs/uvicorn.log 2>&1 &
          sleep 2
          
          # Health check
          curl -s http://localhost:8000/api/v1/health
          echo "✅ Deploy completed"
          EOF
