name: Deploy to Frankfurt Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: 104.248.45.198
          username: root
          key: ${{ secrets.FRANKFURT_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            set -e
            cd /var/www/aegis_nexus
            git pull origin main
            source venv/bin/activate
            pip install -r requirements.txt
            systemctl restart uvicorn
            echo "✅ Deployment completed successfully!"
