# Logrotate configuration for IOC Collector
# Location: /etc/logrotate.d/aegis-ioc

/var/log/aegis/ioc_collector.log
/var/log/aegis/ioc_collector_errors.log
{
    # Rotate daily
    daily
    
    # Keep 30 days of rotated logs
    rotate 30
    
    # Compress rotated logs
    compress
    delaycompress
    
    # Don't error if log is missing
    missingok
    
    # Don't rotate empty files
    notifempty
    
    # Create new log file with same permissions
    create 0644 root root
    
    # Use dateext for filenames (ioc_collector.log-2026-04-17)
    dateext
    dateformat -%Y-%m-%d
    
    # Run script after rotation
    sharedscripts
    postrotate
        # Send HUP signal to cron (optional)
        systemctl reload rsyslog > /dev/null 2>&1 || true
    endscript
}
