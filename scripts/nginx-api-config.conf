# Nginx configuration for api.aegisnexus.dev subdomain
# Place this in: /etc/nginx/sites-available/api.aegisnexus.dev
# Then: sudo ln -s /etc/nginx/sites-available/api.aegisnexus.dev /etc/nginx/sites-enabled/
# Finally: sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name api.aegisnexus.dev;
    
    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.aegisnexus.dev;

    # SSL certificates (from Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/api.aegisnexus.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.aegisnexus.dev/privkey.pem;
    
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # API backend proxy (running on port 5000)
    location /api/v1/ {
        proxy_pass http://localhost:5000/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # API documentation
    location /docs {
        alias /var/www/aegis_nexus/frontend/templates;
        index api-docs.html;
        try_files $uri $uri/ /api-docs.html;
    }

    # Test panel
    location /test {
        alias /var/www/aegis_nexus/frontend;
        index api-test.html;
        try_files $uri $uri/ /api-test.html;
    }

    # Root redirect
    location / {
        return 301 https://$server_name/docs;
    }

    # Logging
    access_log /var/log/nginx/api.aegisnexus.dev-access.log;
    error_log /var/log/nginx/api.aegisnexus.dev-error.log;
}
