<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AegisNexus - AI Güvenlik Asistanı</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            color: #e2e8f0;
            padding: 20px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 20px;
        }
        
        header h1 {
            font-size: 2.2rem;
            background: linear-gradient(135deg, #22d3ee, #a855f7);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        
        header p {
            color: #94a3b8;
            font-size: 1.1rem;
        }
        
        /* Input Section */
        .input-section {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 30px;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 8px;
            font-weight: 500;
        }
        
        textarea {
            width: 100%;
            min-height: 150px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 15px;
            color: #e2e8f0;
            font-size: 1rem;
            resize: vertical;
            font-family: inherit;
        }
        
        textarea:focus {
            outline: none;
            border-color: #22d3ee;
            box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.1);
        }
        
        .options-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        select, input[type="text"] {
            width: 100%;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 12px 15px;
            color: #e2e8f0;
            font-size: 1rem;
        }
        
        select:focus, input:focus {
            outline: none;
            border-color: #22d3ee;
        }
        
        /* Analyze Button */
        .analyze-btn {
            width: 100%;
            background: linear-gradient(135deg, #22d3ee, #3b82f6);
            border: none;
            border-radius: 12px;
            padding: 16px 30px;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .analyze-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(34, 211, 238, 0.3);
        }
        
        .analyze-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Result Section */
        .result-section {
            display: none;
        }
        
        .result-section.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Status Card */
        .status-card {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 2px solid;
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            margin-bottom: 30px;
        }
        
        .status-card.safe {
            border-color: #22c55e;
            background: linear-gradient(135deg, rgba(34, 197, 94, 0.1), #0f172a);
        }
        
        .status-card.suspicious {
            border-color: #f59e0b;
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.1), #0f172a);
        }
        
        .status-card.danger {
            border-color: #ef4444;
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.1), #0f172a);
        }
        
        .status-icon {
            font-size: 4rem;
            margin-bottom: 15px;
        }
        
        .status-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 10px;
        }
        
        .status-card.safe .status-title { color: #22c55e; }
        .status-card.suspicious .status-title { color: #f59e0b; }
        .status-card.danger .status-title { color: #ef4444; }
        
        .confidence-badge {
            display: inline-block;
            background: rgba(255,255,255,0.1);
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.9rem;
            margin-top: 10px;
        }
        
        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .stat-box {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }
        
        .stat-label {
            color: #94a3b8;
            font-size: 0.85rem;
            margin-bottom: 8px;
        }
        
        .stat-value {
            font-size: 1.3rem;
            font-weight: 600;
            color: #e2e8f0;
        }
        
        /* Details Cards */
        .details-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        .detail-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 25px;
        }
        
        .detail-card h3 {
            color: #22d3ee;
            font-size: 1.1rem;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .detail-list {
            list-style: none;
        }
        
        .detail-list li {
            padding: 10px 0;
            border-bottom: 1px solid #334155;
            color: #e2e8f0;
            font-size: 0.95rem;
        }
        
        .detail-list li:last-child {
            border-bottom: none;
        }
        
        .detail-list li:before {
            content: "⚠️";
            margin-right: 8px;
        }
        
        .detail-list li.safe:before {
            content: "✅";
        }
        
        .detail-list li.warning:before {
            content: "⚡";
        }
        
        /* Recommendations */
        .recommendations {
            background: linear-gradient(135deg, rgba(34, 211, 238, 0.1), rgba(168, 85, 247, 0.1));
            border: 1px solid #22d3ee;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
        }

        /* History Section */
        .history-section {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 30px;
        }

        .history-section h2 {
            color: #22d3ee;
            font-size: 1.3rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .history-list {
            display: grid;
            gap: 12px;
        }

        .history-item {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .history-item:hover {
            border-color: #22d3ee;
            transform: translateY(-2px);
        }

        .history-item .url {
            color: #e2e8f0;
            font-size: 0.95rem;
            max-width: 60%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .history-item .meta {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .history-item .risk-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .history-item .risk-badge.high {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        .history-item .risk-badge.medium {
            background: rgba(245, 158, 11, 0.2);
            color: #f59e0b;
        }

        .history-item .risk-badge.low {
            background: rgba(34, 197, 94, 0.2);
            color: #22c55e;
        }

        .history-item .risk-badge.safe {
            background: rgba(59, 130, 246, 0.2);
            color: #3b82f6;
        }

        .history-item .time {
            color: #94a3b8;
            font-size: 0.85rem;
        }

        .history-item .loading {
            text-align: center;
            color: #94a3b8;
            padding: 20px;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 30px;
            max-width: 700px;
            max-height: 80vh;
            overflow-y: auto;
            width: 90%;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #334155;
        }

        .modal-header h3 {
            color: #22d3ee;
            font-size: 1.3rem;
        }

        .modal-close {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 5px;
        }

        .modal-close:hover {
            color: #e2e8f0;
        }

        .modal-body {
            color: #e2e8f0;
        }

        .modal-body .url {
            background: #0f172a;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            margin-bottom: 15px;
            word-break: break-all;
        }

        .modal-body .checks {
            margin-top: 15px;
        }

        .modal-body .check-item {
            padding: 8px 0;
            border-bottom: 1px solid #334155;
            font-size: 0.9rem;
        }
        
        .recommendations h3 {
            color: #22d3ee;
            margin-bottom: 15px;
            font-size: 1.2rem;
        }
        
        .rec-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .rec-item:last-child {
            border-bottom: none;
        }
        
        .rec-priority {
            background: #ef4444;
            color: white;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .rec-priority.medium {
            background: #f59e0b;
        }
        
        .rec-priority.low {
            background: #22c55e;
        }
        
        .rec-content {
            flex: 1;
        }
        
        .rec-action {
            font-weight: 600;
            color: #e2e8f0;
            margin-bottom: 4px;
        }
        
        .rec-desc {
            color: #94a3b8;
            font-size: 0.9rem;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .options-row, .stats-grid, .details-grid {
                grid-template-columns: 1fr;
            }
            
            header h1 {
                font-size: 1.6rem;
            }
        }
        
        /* Error Message */
        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid #ef4444;
            border-radius: 12px;
            padding: 20px;
            color: #ef4444;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🤖 AI Güvenlik Asistanı</h1>
            <p>Mesajları AI ile analiz edin, phishing ve dolandırıcılığı tespit edin</p>
        </header>

        <div class="input-section">
            <div class="input-group">
                <label>📧 Analiz Edilecek Mesaj</label>
                <textarea id="messageInput" placeholder="Örnek: Banka hesabınızda şüpheli aktivite tespit edildi! Hemen doğrulamak için linke tıklayın: http://fake-banka.com/verify&#10;&#10;24 saat içinde işlem yapmazsanız hesabınız kapatılacaktır."></textarea>
            </div>
            
            <div class="options-row">
                <div class="input-group">
                    <label>📱 Mesaj Tipi</label>
                    <select id="contextSelect">
                        <option value="email">E-posta (Email)</option>
                        <option value="sms">SMS / Mesaj</option>
                        <option value="whatsapp">WhatsApp</option>
                        <option value="social_media">Sosyal Medya</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>👤 Gönderen (Opsiyonel)</label>
                    <input type="text" id="senderInput" placeholder="ornek@email.com">
                </div>
            </div>
            
            <button class="analyze-btn" id="analyzeBtn" onclick="analyzeMessage()">
                <span>🔍 Analiz Et</span>
            </button>
        </div>

        <!-- URL Analizi Geçmişi -->
        <div class="history-section">
            <h2>📜 Son URL Analizleri</h2>
            <div class="history-list" id="historyList">
                <div class="loading">Yükleniyor...</div>
            </div>
        </div>

        <div class="result-section" id="resultSection">
            <!-- Sonuçlar buraya gelecek -->
        </div>
    </div>

    <!-- Detail Modal -->
    <div class="modal" id="detailModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>🔍 URL Analiz Detayları</h3>
                <button class="modal-close" onclick="closeModal()">×</button>
            </div>
            <div class="modal-body" id="modalContent">
                <!-- Detaylar buraya gelecek -->
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/api/v2';
        
        // Sayfa yüklendiğinde geçmişi çek
        document.addEventListener('DOMContentLoaded', () => {
            loadHistory();
        });
        
        async function loadHistory() {
            try {
                const response = await fetch(`${API_BASE}/ai-analyzer/history?limit=10`);
                if (!response.ok) throw new Error('History API error');
                const data = await response.json();
                displayHistory(data.data);
            } catch (error) {
                console.error('History error:', error);
                document.getElementById('historyList').innerHTML = '<div class="loading">Geçmiş yüklenemedi</div>';
            }
        }
        
        function displayHistory(history) {
            const list = document.getElementById('historyList');
            if (!history || history.length === 0) {
                list.innerHTML = '<div class="loading">Henüz analiz yapılmadı</div>';
                return;
            }
            
            list.innerHTML = history.map(item => {
                const riskClass = item.risk_level;
                const riskLabel = {
                    'high': 'YÜKSEK',
                    'medium': 'ORTA',
                    'low': 'DÜŞÜK',
                    'safe': 'GÜVENLİ'
                }[item.risk_level] || item.risk_level.toUpperCase();
                
                const time = new Date(item.created_at).toLocaleString('tr-TR');
                
                return `
                    <div class="history-item" onclick="showHistoryDetail(${item.id})">
                        <div class="url">${item.url}</div>
                        <div class="meta">
                            <span class="risk-badge ${riskClass}">${riskLabel}</span>
                            <span class="time">${time}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        async function showHistoryDetail(id) {
            try {
                const response = await fetch(`${API_BASE}/ai-analyzer/history/${id}`);
                if (!response.ok) throw new Error('Detail API error');
                const data = await response.json();
                showModal(data);
            } catch (error) {
                console.error('Detail error:', error);
                alert('Detay yüklenemedi');
            }
        }
        
        function showModal(data) {
            const modal = document.getElementById('detailModal');
            const content = document.getElementById('modalContent');
            
            const checks = data.url_checks || [];
            const time = new Date(data.created_at).toLocaleString('tr-TR');
            
            content.innerHTML = `
                <div class="url">${data.url}</div>
                <div style="display: flex; gap: 20px; margin-bottom: 15px;">
                    <div><strong>Risk Seviyesi:</strong> <span class="risk-badge ${data.risk_level}">${data.risk_level.toUpperCase()}</span></div>
                    <div><strong>Phishing:</strong> ${data.is_phishing ? 'EVET ⚠️' : 'HAYIR ✅'}</div>
                    <div><strong>Güven:</strong> %${Math.round((data.confidence || 0) * 100)}</div>
                </div>
                <div style="color: #94a3b8; margin-bottom: 15px;"><strong>Analiz Zamanı:</strong> ${time}</div>
                <div class="checks">
                    <h4 style="color: #22d3ee; margin-bottom: 10px;">Kontrol Sonuçları:</h4>
                    ${checks.length ? checks.map(check => `<div class="check-item">${check}</div>`).join('') : '<div class="check-item">Kontrol sonucu yok</div>'}
                </div>
            `;
            
            modal.classList.add('show');
        }
        
        function closeModal() {
            document.getElementById('detailModal').classList.remove('show');
        }
        
        async function analyzeMessage() {
            const btn = document.getElementById('analyzeBtn');
            const message = document.getElementById('messageInput').value;
            const context = document.getElementById('contextSelect').value;
            const sender = document.getElementById('senderInput').value;
            
            if (!message.trim()) {
                alert('Lütfen analiz edilecek mesajı girin!');
                return;
            }
            
            // Loading state
            btn.disabled = true;
            btn.innerHTML = '<div class="spinner"></div><span>Analiz ediliyor...</span>';
            
            try {
                const response = await fetch(`${API_BASE}/ai-analyzer/analyze`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: message,
                        context: context,
                        sender: sender || null
                    })
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const result = await response.json();
                displayResult(result);
                
            } catch (error) {
                console.error('Analiz hatası:', error);
                document.getElementById('resultSection').innerHTML = `
                    <div class="error-message">
                        ❌ Analiz sırasında hata oluştu: ${error.message}<br>
                        <small>Backend çalışıyor mu kontrol edin</small>
                    </div>
                `;
                document.getElementById('resultSection').classList.add('show');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<span>🔍 Analiz Et</span>';
            }
        }
        
        function displayResult(data) {
            const section = document.getElementById('resultSection');
            const assessment = data.security_assessment;
            const analysis = data.detailed_analysis;
            
            // Status card styling
            let statusClass = 'safe';
            let statusIcon = '✅';
            let statusTitle = 'GÜVENLİ';
            
            if (assessment.threat_level === 'high' || assessment.threat_level === 'critical') {
                statusClass = 'danger';
                statusIcon = '⚠️';
                statusTitle = 'TEHLİKELİ!';
            } else if (assessment.threat_level === 'medium') {
                statusClass = 'suspicious';
                statusIcon = '⚡';
                statusTitle = 'ŞÜPHELİ';
            }
            
            // Build HTML
            section.innerHTML = `
                <div class="status-card ${statusClass}">
                    <div class="status-icon">${statusIcon}</div>
                    <div class="status-title">${statusTitle}</div>
                    <div class="confidence-badge">AI Güven: %${Math.round(assessment.risk_score || 95)}</div>
                </div>
                
                <div class="stats-grid">
                    <div class="stat-box">
                        <div class="stat-label">Phishing</div>
                        <div class="stat-value">${assessment.is_phishing ? 'EVET ⚠️' : 'HAYIR ✅'}</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">Dolandırıcılık</div>
                        <div class="stat-value">${assessment.is_scam ? 'EVET ⚠️' : 'HAYIR ✅'}</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">Tehdit Seviyesi</div>
                        <div class="stat-value">${assessment.threat_level?.toUpperCase() || 'N/A'}</div>
                    </div>
                </div>
                
                <div class="details-grid">
                    <div class="detail-card">
                        <h3>🎯 Tespit Edilen Tehditler</h3>
                        <ul class="detail-list">
                            ${analysis.ai_analysis?.identified_threats?.map(t => 
                                `<li>${t}</li>`
                            ).join('') || '<li>Belirgin tehdit tespit edilmedi</li>'}
                        </ul>
                    </div>
                    
                    <div class="detail-card">
                        <h3>🧠 Psikolojik Manipülasyon</h3>
                        <ul class="detail-list">
                            ${analysis.ai_analysis?.psychological_triggers?.map(p => {
                                const names = {
                                    'urgency': '⏰ Aciliyet / Acele',
                                    'fear': '😰 Korku / Tehdit',
                                    'greed': '💰 Açgözlülük / Para',
                                    'authority': '👔 Sahte Otorite'
                                };
                                return `<li class="warning">${names[p] || p}</li>`;
                            }).join('') || '<li class="safe">Tespit edilmedi</li>'}
                        </ul>
                    </div>
                </div>
                
                ${data.recommendations?.length ? `
                <div class="recommendations">
                    <h3>📋 AI Önerileri</h3>
                    ${data.recommendations.map(rec => `
                        <div class="rec-item">
                            <span class="rec-priority ${rec.priority?.toLowerCase()}">${rec.priority}</span>
                            <div class="rec-content">
                                <div class="rec-action">${rec.action}</div>
                                <div class="rec-desc">${rec.description}</div>
                            </div>
                        </div>
                    `).join('')}
                </div>
                ` : ''}
                
                <div class="detail-card" style="margin-top: 20px;">
                    <h3>📝 AI Raporu</h3>
                    <p style="color: #94a3b8; line-height: 1.6;">${data.summary || 'Rapor oluşturulamadı'}</p>
                </div>
            `;
            
            section.classList.add('show');
            section.scrollIntoView({ behavior: 'smooth' });
        }
        
        // Enter key support
        document.getElementById('messageInput').addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'Enter') {
                analyzeMessage();
            }
        });
    </script>
