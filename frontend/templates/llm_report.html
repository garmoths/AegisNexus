<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aegis Nexus - LLM Breach Report</title>
    <link rel="stylesheet" href="/static/aegis.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: #fff;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #4facfe, #00f2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            font-size: 1.1em;
            color: #aaa;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(79, 172, 254, 0.2);
            border-radius: 10px;
            padding: 30px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #fff;
            margin-bottom: 8px;
            font-weight: 500;
        }

        input[type="text"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(79, 172, 254, 0.3);
            border-radius: 5px;
            color: #fff;
            font-size: 1em;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        select:focus,
        textarea:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.15);
            border-color: #4facfe;
            box-shadow: 0 0 10px rgba(79, 172, 254, 0.3);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .checkbox-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .checkbox-group label {
            display: flex;
            align-items: center;
            margin: 0;
            cursor: pointer;
        }

        .checkbox-group input[type="checkbox"] {
            width: auto;
            margin-right: 8px;
            cursor: pointer;
        }

        button {
            background: linear-gradient(90deg, #4facfe, #00f2fe);
            color: #fff;
            border: none;
            padding: 12px 40px;
            border-radius: 5px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(79, 172, 254, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .loading {
            display: none;
            text-align: center;
            color: #4facfe;
            padding: 20px;
        }

        .spinner {
            border: 3px solid rgba(79, 172, 254, 0.3);
            border-top: 3px solid #4facfe;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .result-card {
            display: none;
            background: linear-gradient(135deg, rgba(79, 172, 254, 0.1), rgba(0, 242, 254, 0.1));
            border-left: 4px solid #4facfe;
            padding: 30px;
            border-radius: 10px;
            margin-top: 30px;
        }

        .result-card.show {
            display: block;
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .report-title {
            font-size: 1.5em;
            color: #4facfe;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .report-content {
            color: #ddd;
            line-height: 1.8;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 1em;
        }

        .report-meta {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(79, 172, 254, 0.3);
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #aaa;
        }

        .meta-icon {
            color: #4facfe;
            font-size: 1.2em;
        }

        .error {
            background: rgba(255, 107, 107, 0.1);
            border-left: 4px solid #ff6b6b;
            color: #ff6b6b;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
            display: none;
        }

        .error.show {
            display: block;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🕷️ Aegis Breach Intelligence</h1>
            <p>Veri sızıntısı analizi ve güvenlik raporu</p>
        </div>

        <!-- Form Card -->
        <div class="card">
            <form id="reportForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="domain">📍 Domain / Şirket Adı *</label>
                        <input type="text" id="domain" name="domain" placeholder="example.com" required>
                    </div>
                    <div class="form-group">
                        <label for="company">🏢 Şirket Adı</label>
                        <input type="text" id="company" name="company" placeholder="Example Corporation">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="email_count">📧 Etkilenen E-mail Sayısı *</label>
                        <input type="number" id="email_count" name="email_count" placeholder="5000" min="0" required>
                    </div>
                    <div class="form-group">
                        <label for="risk_score">⚠️ Risk Skoru (0-100) *</label>
                        <input type="number" id="risk_score" name="risk_score" placeholder="75" min="0" max="100" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>📋 Sızdırılan Veri Türleri</label>
                    <div class="checkbox-group">
                        <label><input type="checkbox" name="data_types" value="email"> Email</label>
                        <label><input type="checkbox" name="data_types" value="password"> Şifre</label>
                        <label><input type="checkbox" name="data_types" value="credit_card"> Kredi Kartı</label>
                        <label><input type="checkbox" name="data_types" value="identity"> Kimlik</label>
                        <label><input type="checkbox" name="data_types" value="phone"> Telefon</label>
                    </div>
                </div>

                <div style="margin-top: 30px;">
                    <button type="submit">🚀 Rapor Oluştur</button>
                </div>
            </form>
        </div>

        <!-- Loading Indicator -->
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Groq LLM analiz yapılıyor...</p>
        </div>

        <!-- Error Message -->
        <div class="error" id="error"></div>

        <!-- Result Card -->
        <div class="result-card" id="resultCard">
            <div class="report-title">📊 Güvenlik Raporu</div>
            <div class="report-content" id="reportContent"></div>
            <div class="report-meta">
                <div class="meta-item">
                    <span class="meta-icon">✓</span>
                    <span id="statusText">Başarılı</span>
                </div>
                <div class="meta-item">
                    <span class="meta-icon">⏱️</span>
                    <span id="timeText">0s</span>
                </div>
                <div class="meta-item">
                    <span class="meta-icon">🤖</span>
                    <span>Groq LLM</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('reportForm');
        const loading = document.getElementById('loading');
        const errorDiv = document.getElementById('error');
        const resultCard = document.getElementById('resultCard');
        const reportContent = document.getElementById('reportContent');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const domain = document.getElementById('domain').value;
            const company = document.getElementById('company').value || domain;
            const email_count = parseInt(document.getElementById('email_count').value);
            const risk_score = parseInt(document.getElementById('risk_score').value);
            
            const dataTypesCheckboxes = document.querySelectorAll('input[name="data_types"]:checked');
            const data_types = Array.from(dataTypesCheckboxes).map(cb => cb.value);

            // Validation
            if (!domain || !email_count || !risk_score) {
                showError('Lütfen tüm zorunlu alanları doldurun');
                return;
            }

            if (risk_score < 0 || risk_score > 100) {
                showError('Risk skoru 0 ile 100 arasında olmalıdır');
                return;
            }

            // Show loading
            loading.style.display = 'block';
            errorDiv.classList.remove('show');
            resultCard.classList.remove('show');

            const startTime = Date.now();

            try {
                const response = await fetch('/api/v2/breach/llm-report', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        domain,
                        email_count,
                        risk_score,
                        company_name: company,
                        data_types
                    })
                });

                if (!response.ok) {
                    throw new Error(`API Error: ${response.status}`);
                }

                const result = await response.json();
                const endTime = Date.now();
                const duration = ((endTime - startTime) / 1000).toFixed(2);

                // Show result
                loading.style.display = 'none';
                reportContent.textContent = result.report || 'Rapor oluşturulamadı';
                document.getElementById('statusText').textContent = result.status === 'success' ? '✓ Başarılı' : '✗ Hata';
                document.getElementById('timeText').textContent = `${duration}s`;
                resultCard.classList.add('show');

            } catch (error) {
                loading.style.display = 'none';
                showError(`Hata: ${error.message}`);
                console.error('Error:', error);
            }
        });

        function showError(message) {
            errorDiv.textContent = message;
            errorDiv.classList.add('show');
        }

        // Set default values for testing
        document.getElementById('domain').value = 'example.com';
        document.getElementById('company').value = 'Example Corporation';
        document.getElementById('email_count').value = '5000';
        document.getElementById('risk_score').value = '85';
        document.querySelector('input[name="data_types"][value="email"]').checked = true;
        document.querySelector('input[name="data_types"][value="password"]').checked = true;
    </script>
</body>
</html>
