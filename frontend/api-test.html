<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔐 Aegis Nexus - API Test</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 900px; margin: 0 auto; }
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        .header h1 { font-size: 2.5em; margin-bottom: 10px; }
        .card {
            background: white;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .card h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.5em;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 600;
        }
        input[type="text"],
        input[type="file"],
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
            font-family: Arial, sans-serif;
        }
        input[type="text"]:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: all 0.3s;
        }
        button:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        button:active { transform: translateY(0); }
        .loading { display: none; text-align: center; }
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .result {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 15px;
            border-radius: 5px;
            margin-top: 15px;
            display: none;
        }
        .result.show { display: block; }
        .result.safe { border-left-color: #28a745; }
        .result.warning { border-left-color: #ffc107; }
        .result.danger { border-left-color: #dc3545; }
        .result-content {
            font-size: 0.95em;
            line-height: 1.6;
        }
        .result-score {
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #ddd;
        }
        .tab-btn {
            background: none;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            color: #666;
            font-weight: 600;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }
        .tab-btn.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background: #f8f9fa;
            font-weight: 600;
            color: #667eea;
        }
        tr:hover { background: #f8f9fa; }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        .stat-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        .stat-box-num {
            font-size: 2em;
            font-weight: bold;
        }
        .stat-box-label {
            font-size: 0.9em;
            opacity: 0.9;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 12px;
            border-radius: 5px;
            margin-top: 10px;
            display: none;
        }
        .error.show { display: block; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔐 Aegis Nexus</h1>
            <p>Phishing Detector API Test</p>
        </div>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('single')">Tek URL</button>
            <button class="tab-btn" onclick="switchTab('bulk')">Toplu Tarama</button>
            <button class="tab-btn" onclick="switchTab('whitelist')">Whitelist</button>
            <button class="tab-btn" onclick="switchTab('stats')">İstatistikler</button>
        </div>

        <!-- Tab 1: Single URL -->
        <div id="single" class="tab-content active">
            <div class="card">
                <h2>🔍 Tek URL Kontrol</h2>
                <div class="form-group">
                    <label>URL Girin:</label>
                    <input type="text" id="singleUrl" placeholder="https://example.com" value="google.com">
                </div>
                <button onclick="checkSingleUrl()">Kontrol Et</button>
                
                <div class="loading" id="singleLoading">
                    <div class="spinner"></div>
                    <p>Taranıyor...</p>
                </div>
                
                <div id="singleResult" class="result"></div>
                <div class="error" id="singleError"></div>
            </div>
        </div>

        <!-- Tab 2: Bulk Scan -->
        <div id="bulk" class="tab-content">
            <div class="card">
                <h2>📋 Toplu Tarama</h2>
                <div class="form-group">
                    <label>CSV Dosyası Yükle (bir URL per satır):</label>
                    <input type="file" id="csvFile" accept=".csv">
                </div>
                <button onclick="bulkScan()">Taramayı Başlat</button>
                
                <div class="loading" id="bulkLoading">
                    <div class="spinner"></div>
                    <p>Taranıyor...</p>
                </div>
                
                <div id="bulkResult" class="result"></div>
                <div class="error" id="bulkError"></div>
            </div>
        </div>

        <!-- Tab 3: Whitelist -->
        <div id="whitelist" class="tab-content">
            <div class="card">
                <h2>🛡️ Whitelist Yönetimi</h2>
                <div class="form-group">
                    <label>Kategori Filtresi:</label>
                    <input type="text" id="whitelistFilter" placeholder="Örn: Tech">
                    <button onclick="getWhitelist()" style="margin-top: 10px;">Yükle</button>
                </div>
                
                <div class="loading" id="whitelistLoading">
                    <div class="spinner"></div>
                    <p>Yükleniyor...</p>
                </div>
                
                <div id="whitelistResult" class="result"></div>
            </div>
        </div>

        <!-- Tab 4: Stats -->
        <div id="stats" class="tab-content">
            <div class="card">
                <h2>📊 İstatistikler</h2>
                <button onclick="getStats()">İstatistikleri Yükle</button>
                
                <div class="loading" id="statsLoading">
                    <div class="spinner"></div>
                    <p>Yükleniyor...</p>
                </div>
                
                <div id="statsResult" class="result"></div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://104.248.45.198:5000/api/v1';

        function switchTab(tabName) {
            // Hide all tabs
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            
            // Show selected tab
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
        }

        function showLoading(id) {
            document.getElementById(id).style.display = 'block';
            document.getElementById(id.replace('Loading', 'Result')).innerHTML = '';
            document.getElementById(id.replace('Loading', 'Error')).classList.remove('show');
        }

        function hideLoading(id) {
            document.getElementById(id).style.display = 'none';
        }

        function showError(id, message) {
            const errorEl = document.getElementById(id.replace('Loading', 'Error'));
            errorEl.textContent = message;
            errorEl.classList.add('show');
        }

        function showResult(id, html, className = 'safe') {
            const resultEl = document.getElementById(id.replace('Loading', 'Result'));
            resultEl.innerHTML = html;
            resultEl.classList.add('show', className);
        }

        // Check single URL
        async function checkSingleUrl() {
            const url = document.getElementById('singleUrl').value;
            if (!url) {
                showError('singleLoading', 'URL girin!');
                return;
            }

            showLoading('singleLoading');

            try {
                const res = await fetch(`${API_BASE}/check-url?url=${encodeURIComponent(url)}`);
                const data = await res.json();
                hideLoading('singleLoading');

                const scoreClass = data.score >= 80 ? 'safe' : data.score >= 60 ? 'warning' : 'danger';
                const html = `
                    <div class="result-score">${data.score}/100</div>
                    <div class="result-content">
                        <p><strong>URL:</strong> ${data.url}</p>
                        <p><strong>Risk Seviyesi:</strong> ${data.risk_level}</p>
                        <p><strong>Zaman:</strong> ${new Date(data.timestamp).toLocaleString('tr-TR')}</p>
                    </div>
                `;
                showResult('singleLoading', html, scoreClass);
            } catch (error) {
                hideLoading('singleLoading');
                showError('singleLoading', `Hata: ${error.message}`);
            }
        }

        // Bulk scan
        async function bulkScan() {
            const file = document.getElementById('csvFile').files[0];
            if (!file) {
                showError('bulkLoading', 'CSV dosyası seçin!');
                return;
            }

            showLoading('bulkLoading');

            try {
                const formData = new FormData();
                formData.append('file', file);

                const res = await fetch(`${API_BASE}/bulk-scan`, {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                hideLoading('bulkLoading');

                const html = `
                    <p><strong>Toplam URL:</strong> ${data.total}</p>
                    <p><strong>🚨 Kritik:</strong> ${data.critical} | <strong>🟠 Yüksek Risk:</strong> ${data.high_risk} | <strong>✅ Güvenli:</strong> ${data.safe}</p>
                    <table>
                        <tr><th>URL</th><th>Score</th><th>Risk Seviyesi</th></tr>
                        ${data.results.map(r => `
                            <tr>
                                <td>${r.url}</td>
                                <td>${r.score}</td>
                                <td>${r.risk_level}</td>
                            </tr>
                        `).join('')}
                    </table>
                `;
                showResult('bulkLoading', html, 'safe');
            } catch (error) {
                hideLoading('bulkLoading');
                showError('bulkLoading', `Hata: ${error.message}`);
            }
        }

        // Get whitelist
        async function getWhitelist() {
            const filter = document.getElementById('whitelistFilter').value;
            showLoading('whitelistLoading');

            try {
                const url = filter 
                    ? `${API_BASE}/whitelist?category=${encodeURIComponent(filter)}&limit=50`
                    : `${API_BASE}/whitelist?limit=50`;
                
                const res = await fetch(url);
                const data = await res.json();
                hideLoading('whitelistLoading');

                const html = `
                    <p><strong>Toplam:</strong> ${data.total} | <strong>Gösterilen:</strong> ${data.returned}</p>
                    <table>
                        <tr><th>Domain</th><th>Kategori</th><th>Şirket</th><th>Güven Seviyesi</th></tr>
                        ${data.domains.map(d => `
                            <tr>
                                <td>${d.domain}</td>
                                <td>${d.category}</td>
                                <td>${d.company_name}</td>
                                <td>${d.trusted_level}</td>
                            </tr>
                        `).join('')}
                    </table>
                `;
                showResult('whitelistLoading', html, 'safe');
            } catch (error) {
                hideLoading('whitelistLoading');
                showError('whitelistLoading', `Hata: ${error.message}`);
            }
        }

        // Get stats
        async function getStats() {
            showLoading('statsLoading');

            try {
                const res = await fetch(`${API_BASE}/stats`);
                const data = await res.json();
                hideLoading('statsLoading');

                const categories = Object.entries(data.categories)
                    .sort((a, b) => b[1] - a[1])
                    .slice(0, 8);

                const html = `
                    <div class="stats-grid">
                        <div class="stat-box">
                            <div class="stat-box-num">${data.whitelist_domains}</div>
                            <div class="stat-box-label">Whitelist Domains</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-box-num">${Object.keys(data.categories).length}</div>
                            <div class="stat-box-label">Kategoriler</div>
                        </div>
                    </div>
                    <h3 style="margin-top: 20px; color: #667eea;">Top Kategoriler</h3>
                    <table>
                        <tr><th>Kategori</th><th>Domain Sayısı</th></tr>
                        ${categories.map(([cat, count]) => `
                            <tr><td>${cat}</td><td>${count}</td></tr>
                        `).join('')}
                    </table>
                `;
                showResult('statsLoading', html, 'safe');
            } catch (error) {
                hideLoading('statsLoading');
                showError('statsLoading', `Hata: ${error.message}`);
            }
        }

        // Test on load
        window.onload = () => {
            console.log('✅ Aegis Nexus API Tester Ready');
            console.log(`API Base: ${API_BASE}`);
        };
    </script>
</body>
</html>
