# AegisNexus — Victim Atlas Nginx Config
# /etc/nginx/sites-available/aegisnexus

upstream fastapi_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name aegisnexus.dev www.aegisnexus.dev;

    # HTTP → HTTPS redirect (SSL aktif olduğunda aç)
    # return 301 https://$host$request_uri;

    root /var/www/aegisnexus/frontend-react/dist;
    index index.html;

    # ── API Proxy ──────────────────────────────────────
    location /api/ {
        proxy_pass http://fastapi_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 60s;
    }

    # ── Docs (Swagger/ReDoc) ───────────────────────────
    location /docs {
        proxy_pass http://fastapi_backend;
        proxy_set_header Host $host;
    }
    location /redoc {
        proxy_pass http://fastapi_backend;
        proxy_set_header Host $host;
    }
    location /openapi.json {
        proxy_pass http://fastapi_backend;
        proxy_set_header Host $host;
    }

    # ── Static assets (cache) ──────────────────────────
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── SPA Fallback ───────────────────────────────────
    # Tüm route'lar index.html'e düşer (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Security headers ───────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Upload limit ───────────────────────────────────
    client_max_body_size 10M;

    # ── Gzip ───────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;
}

# ── modules.aegisnexus.dev (ModulesApp) ────────────────
server {
    listen 80;
    server_name modules.aegisnexus.dev;

    root /var/www/aegisnexus/frontend-react/dist;
    index index.html;

    location /api/ {
        proxy_pass http://fastapi_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
